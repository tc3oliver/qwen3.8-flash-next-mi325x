# Qwen3.8-Flash-Next-FP8 on 4x MI325X (GPU0-3) + LiteLLM gateway with session affinity.
# Two layouts, selected by LAYOUT in .env (compose profile of the same name):
#   tp1x4  four single-GPU replicas vllm-1..4   (default: ~1.4-1.7x the agent throughput per GPU)
#   tp2x2  two TP2 replicas vllm-a, vllm-b      (original spec; lower idle single-request TTFT)
# Operate via deploy/scripts/ (up.sh, down.sh, restart.sh, status.sh, logs.sh); see ../README.md.
# Every workaround/tuning below cites its source and the version it was checked against
# (vLLM 0.32.0 image); measurements are in ../docs/lab-notebook.md and ../results/.

x-vllm: &vllm
  image: ${VLLM_IMAGE:?set in .env}
  restart: unless-stopped
  ipc: host
  shm_size: "32g"
  devices: [/dev/kfd, /dev/dri]
  group_add: [video, render]
  cap_add: [SYS_PTRACE]
  security_opt: [seccomp=unconfined]
  networks: [qwen38]
  logging:
    driver: json-file
    options: { max-size: "200m", max-file: "5" }
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
    start_period: 40m          # 131 FP8 shards + first-run AITER JIT compile (~4.5 min observed)
    interval: 30s
    timeout: 10s
    retries: 5

x-vllm-env: &vllm-env
  HF_HUB_OFFLINE: "1"                    # never download at runtime; weights come from the ro mount
  VLLM_CACHE_ROOT: /cache/vllm
  VLLM_ROCM_USE_AITER: "1"
  # AITER FP8 MoE beat Triton MoE on this image (decode c64 -7% with Triton; t04 in ../docs/lab-notebook.md).
  VLLM_ROCM_USE_AITER_MOE: ${VLLM_ROCM_USE_AITER_MOE:-1}
  # TP>1 only: the packed FP8 PLE reduce all-reduces int8, unsupported by AITER custom AR
  # (vllm#58688 maintainer comment 2026-10-12; auto-fallback vllm#60839 not merged in v0.32.0).
  VLLM_ROCM_USE_AITER_CUSTOM_AR: "0"
  # Shuffled KV layout crashed a sibling hybrid model with hipErrorIllegalAddress (team MI300X notes).
  VLLM_ROCM_SHUFFLE_KV_CACHE_LAYOUT: "0"
  SAFETENSORS_FAST_GPU: "1"
  HIP_FORCE_DEV_KERNARG: "1"
  HSA_NO_SCRATCH_RECLAIM: "1"
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  TORCH_BLAS_PREFER_HIPBLASLT: "1"
  OMP_NUM_THREADS: "8"
  # Local QSA overlay (../overlay/qsa.py, see ../overlay/README.md): sparse-GQA prefill launch profile
  # tuned on gfx942 (BLOCK_N 32, 1 split, 2 warps, 1 stage; stock profile was tuned on GB300).
  VLLM_QSA_GQA_PREFILL: "32,1,2,1"

# Volumes used by every replica (expanded per service below; YAML cannot merge lists):
x-vllm-volumes: &vllm-volumes
  - ${MODEL_DIR:?set in .env}:/models/qwen3.8-flash-next-fp8:ro
  - ./runtime/aiter:/root/.aiter
  - ../tuned/aiter:/aiter-tuned:ro
  # QSA indexer/sparse-GQA overlay for vLLM v0.32.0 (base sha256 7a7c8501...). 4-20x faster indexer
  # scoring; measured +70% prefill, +41% decode c64 (e02 in ../docs/lab-notebook.md).
  - ../overlay/qsa.py:/usr/local/lib/python3.12/dist-packages/vllm/models/qwen4_exp/amd/ops/qsa.py:ro

x-cmd-tp1: &cmd-tp1
  - /models/qwen3.8-flash-next-fp8
  - --served-model-name=${SERVED_MODEL_NAME:-qwen3.8-flash-next}
  - --host=0.0.0.0
  - --port=8000
  - --tensor-parallel-size=1
  - --max-model-len=${MAX_MODEL_LEN:-262144}
  - --max-num-seqs=${MAX_NUM_SEQS:-64}
  - --gpu-memory-utilization=${GPU_MEMORY_UTILIZATION:-0.93}
  # 32768 measured best (16K: -8% prefill; 64K: -19% decode c64). vllm#54764 (PLE prefill padding
  # OOM at 32768 on 0.28) is fixed by vllm#60021 (in 0.32.0); 32x8K and 16x60K bursts pass.
  - --max-num-batched-tokens=${MAX_NUM_BATCHED_TOKENS:-32768}
  - --enable-chunked-prefill
  - --enable-prefix-caching
  - --enable-prompt-tokens-details   # report usage.prompt_tokens_details.cached_tokens
  - --async-scheduling
  # MTP: 1-layer MTP head; V2 model runner (default in 0.32) so vllm#53983 does not apply;
  # vllm#55357 fixed by vllm#55375. 3 measured best (2: equal, 4: -22% decode c64).
  - --speculative-config={"method":"mtp","num_speculative_tokens":${MTP_TOKENS:-3}}
  # Keep the 51B N-gram table in HBM (AMD default is CPU offload since vllm#57497).
  - --engram-config={"cpu_offload":false}
  # vllm#61486 (open): PIECEWISE graph replay reads stale n-gram offsets on the AMD path.
  - --compilation-config={"cudagraph_mode":"FULL_DECODE_ONLY"}
  # Opt-in AITER FlyDSL GDN prefill kernels (CDNA3+, head dims 128/128): agent96k_c4 wall -5..-9%,
  # p95 TTFT -11% (t07, c02, c02r).
  - --additional-config={"gdn_prefill_backend":"aiter_flydsl"}
  # QSA requires a BF16 main KV cache (vllm/models/qwen4_exp/amd/qsa.py) -> no --kv-cache-dtype fp8.
  - --enable-auto-tool-choice
  - --tool-call-parser=qwen3_coder
  - --reasoning-parser=qwen3

x-cmd-tp2: &cmd-tp2
  - /models/qwen3.8-flash-next-fp8
  - --served-model-name=${SERVED_MODEL_NAME:-qwen3.8-flash-next}
  - --host=0.0.0.0
  - --port=8000
  - --tensor-parallel-size=2
  # Experts split across the 2 ranks (expert width 640 does not tile into 128-wide FP8 blocks under
  # pure TP; AITER FP8 MoE rejects the refined 64x64 scales, vllm#60839).
  - --enable-expert-parallel
  - --max-model-len=${MAX_MODEL_LEN:-262144}
  - --max-num-seqs=${MAX_NUM_SEQS:-64}
  - --gpu-memory-utilization=${GPU_MEMORY_UTILIZATION:-0.93}
  - --max-num-batched-tokens=${MAX_NUM_BATCHED_TOKENS:-32768}
  - --enable-chunked-prefill
  - --enable-prefix-caching
  - --enable-prompt-tokens-details
  - --async-scheduling
  - --speculative-config={"method":"mtp","num_speculative_tokens":${MTP_TOKENS:-3}}
  - --engram-config={"cpu_offload":false}
  - --compilation-config={"cudagraph_mode":"FULL_DECODE_ONLY"}
  - --enable-auto-tool-choice
  - --tool-call-parser=qwen3_coder
  - --reasoning-parser=qwen3

x-tp1: &tp1
  <<: *vllm
  command: *cmd-tp1
  profiles: [tp1x4]

x-tp2-env: &tp2-env
  <<: *vllm-env
  # Tuned MoE table for E=256 local experts (EP2).
  AITER_CONFIG_FMOE: /usr/local/lib/python3.12/dist-packages/aiter/configs/tuned_fmoe.csv:/aiter-tuned/tuned_fmoe_qwen38_ep2.csv
  # TP all-reduce over one XGMI link is ~30% of prefill; QuickReduce INT6 (bf16 kernels): prefill
  # +14..+17%, agent wall -8..-15% (e03/e11). Quantized reduction: validated by full GSM8K (README).
  VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: ${TP2_QUICK_REDUCE:-INT6}
  VLLM_ROCM_QUICK_REDUCE_CAST_BF16_TO_FP16: "0"

x-tp1-env: &tp1-env
  <<: *vllm-env
  # Tuned MoE table for all 512 experts on one GPU: M=16384 +7.5%, M=32768 +11.7%.
  AITER_CONFIG_FMOE: /usr/local/lib/python3.12/dist-packages/aiter/configs/tuned_fmoe.csv:/aiter-tuned/tuned_fmoe_qwen38_tp1.csv

services:
  # ---------------- layout tp1x4: one replica per GPU ----------------
  vllm-1:
    <<: *tp1
    container_name: qwen38-vllm-1
    environment: { <<: *tp1-env, HIP_VISIBLE_DEVICES: "${R1_HIP:-1}" }
    ports: ["${BIND_ADDR:-127.0.0.1}:${R1_PORT:-8001}:8000"]
    volumes:
      - ${MODEL_DIR:?set in .env}:/models/qwen3.8-flash-next-fp8:ro
      - ./runtime/aiter:/root/.aiter
      - ../tuned/aiter:/aiter-tuned:ro
      - ../overlay/qsa.py:/usr/local/lib/python3.12/dist-packages/vllm/models/qwen4_exp/amd/ops/qsa.py:ro
      - ./runtime/vllm-1:/cache/vllm
  vllm-2:
    <<: *tp1
    container_name: qwen38-vllm-2
    environment: { <<: *tp1-env, HIP_VISIBLE_DEVICES: "${R2_HIP:-3}" }
    ports: ["${BIND_ADDR:-127.0.0.1}:${R2_PORT:-8002}:8000"]
    volumes:
      - ${MODEL_DIR:?set in .env}:/models/qwen3.8-flash-next-fp8:ro
      - ./runtime/aiter:/root/.aiter
      - ../tuned/aiter:/aiter-tuned:ro
      - ../overlay/qsa.py:/usr/local/lib/python3.12/dist-packages/vllm/models/qwen4_exp/amd/ops/qsa.py:ro
      - ./runtime/vllm-2:/cache/vllm
  vllm-3:
    <<: *tp1
    container_name: qwen38-vllm-3
    environment: { <<: *tp1-env, HIP_VISIBLE_DEVICES: "${R3_HIP:-2}" }
    ports: ["${BIND_ADDR:-127.0.0.1}:${R3_PORT:-8003}:8000"]
    volumes:
      - ${MODEL_DIR:?set in .env}:/models/qwen3.8-flash-next-fp8:ro
      - ./runtime/aiter:/root/.aiter
      - ../tuned/aiter:/aiter-tuned:ro
      - ../overlay/qsa.py:/usr/local/lib/python3.12/dist-packages/vllm/models/qwen4_exp/amd/ops/qsa.py:ro
      - ./runtime/vllm-3:/cache/vllm
  vllm-4:
    <<: *tp1
    container_name: qwen38-vllm-4
    environment: { <<: *tp1-env, HIP_VISIBLE_DEVICES: "${R4_HIP:-0}" }
    ports: ["${BIND_ADDR:-127.0.0.1}:${R4_PORT:-8004}:8000"]
    volumes:
      - ${MODEL_DIR:?set in .env}:/models/qwen3.8-flash-next-fp8:ro
      - ./runtime/aiter:/root/.aiter
      - ../tuned/aiter:/aiter-tuned:ro
      - ../overlay/qsa.py:/usr/local/lib/python3.12/dist-packages/vllm/models/qwen4_exp/amd/ops/qsa.py:ro
      - ./runtime/vllm-4:/cache/vllm

  # ---------------- layout tp2x2: original spec ----------------
  vllm-a:
    <<: *vllm
    command: *cmd-tp2
    profiles: [tp2x2]
    container_name: qwen38-vllm-a
    environment: { <<: *tp2-env, HIP_VISIBLE_DEVICES: "${REPLICA_A_HIP:-1,3}" }
    ports: ["${BIND_ADDR:-127.0.0.1}:${REPLICA_A_PORT:-8001}:8000"]
    volumes:
      - ${MODEL_DIR:?set in .env}:/models/qwen3.8-flash-next-fp8:ro
      - ./runtime/aiter:/root/.aiter
      - ../tuned/aiter:/aiter-tuned:ro
      - ../overlay/qsa.py:/usr/local/lib/python3.12/dist-packages/vllm/models/qwen4_exp/amd/ops/qsa.py:ro
      - ./runtime/vllm-a:/cache/vllm
  vllm-b:
    <<: *vllm
    command: *cmd-tp2
    profiles: [tp2x2]
    container_name: qwen38-vllm-b
    environment: { <<: *tp2-env, HIP_VISIBLE_DEVICES: "${REPLICA_B_HIP:-2,0}" }
    ports: ["${BIND_ADDR:-127.0.0.1}:${REPLICA_B_PORT:-8002}:8000"]
    volumes:
      - ${MODEL_DIR:?set in .env}:/models/qwen3.8-flash-next-fp8:ro
      - ./runtime/aiter:/root/.aiter
      - ../tuned/aiter:/aiter-tuned:ro
      - ../overlay/qsa.py:/usr/local/lib/python3.12/dist-packages/vllm/models/qwen4_exp/amd/ops/qsa.py:ro
      - ./runtime/vllm-b:/cache/vllm

  litellm:
    image: ${LITELLM_IMAGE:?set in .env}
    container_name: qwen38-litellm
    restart: unless-stopped
    networks: [qwen38]
    ports: ["${LITELLM_BIND_ADDR:-0.0.0.0}:${LITELLM_PORT:-4000}:4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set in .env}
      # Default 300 s. Shorter DNS cache TTL; on its own it did not fix the failover hang below.
      AIOHTTP_TTL_DNS_CACHE: "10"
      # With LiteLLM's default aiohttp transport the first request after a replica was stopped hung
      # ~72 s before failing over; the httpx transport fails over in 0.64 s
      # (../results/gateway/failover-tp1x4-v*.json).
      DISABLE_AIOHTTP_TRANSPORT: "True"
    volumes:
      - ./config/litellm.${LAYOUT:-tp1x4}.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    logging:
      driver: json-file
      options: { max-size: "100m", max-file: "5" }
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 30s
      timeout: 10s
      retries: 5
    profiles: [gateway]

networks:
  qwen38:
    name: qwen38
